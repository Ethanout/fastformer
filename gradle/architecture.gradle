abstract class VerifySourceLayout extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getJavaSources()

    @TaskAction void verify() {
        def violations = []
        def boundedPackages = [:].withDefault { [] }
        javaSources.files.each { source ->
            String text = source.getText('UTF-8')
            def declaration = text =~ /(?m)^package ([\w.]+);/
            if (!declaration.find()) {
                violations.add("Missing package: ${source.name}")
                return
            }
            String packageName = declaration.group(1)
            String dependencies = text.replaceFirst(/(?m)^package [\w.]+;/, '')
            String path = source.path.replace('\\', '/')
            if (!path.endsWith(packageName.replace('.', '/') + '/' + source.name)) {
                violations.add("Package path mismatch: ${path}")
            }
            boolean main = path.contains('/src/main/java/')
            boolean gameTest = path.contains('/src/gametest/java/')
            if (main && (packageName.startsWith('io.github.fastformer.server.history') ||
                    packageName.startsWith('io.github.fastformer.server.sync') ||
                    packageName.startsWith('io.github.fastformer.server.session') ||
                    packageName.startsWith('io.github.fastformer.server.feedback') ||
                    packageName.startsWith('io.github.fastformer.server.task') ||
                    packageName.startsWith('io.github.fastformer.server.worldwrite') ||
                    packageName.startsWith('io.github.fastformer.server.network.upload') ||
                    packageName.startsWith('io.github.fastformer.protocol.') ||
                    packageName.startsWith('io.github.fastformer.common.history') ||
                    packageName.startsWith('io.github.fastformer.common.raycast') ||
                    packageName.startsWith('io.github.fastformer.common.preview')) && source.name != 'package-info.java') {
                boundedPackages[packageName].add(source)
            }
            if (main && packageName == 'io.github.fastformer' && source.name != 'FastFormer.java') {
                violations.add("Unexpected type in mod entry package: ${path}")
            }
            if (main && packageName == 'io.github.fastformer.fastplace') {
                violations.add("Feature type must belong to a responsibility package: ${path}")
            }
            if (main && (source.name.contains('GameTests') || source.name == 'RecoveryProcessTests.java')) {
                violations.add("Test harness in production source: ${path}")
            }
            if (main && (text =~ /\b(?:[\w]+GameTests|[\w]*TestAccess|RecoveryProcessTests)\b/).find()) {
                violations.add("Production source depends on test harness: ${path}")
            }
            if (main && (text =~ /\b(?:FaceRasterizationMode|BoundaryInterpolatedFaceRasterizer)\b/).find()) {
                violations.add("Retired quad rasterization mode or solver: ${path}")
            }
            if (main && (text =~ /\b(?:VersionedHistoryEnvelope|HistoryEnvelopeFile)\b/).find()) {
                violations.add("Retired history envelope bypasses shared persistence: ${path}")
            }
            if (main && (packageName.startsWith('io.github.fastformer.server.recovery') ||
                    packageName.startsWith('io.github.fastformer.server.history.store')) &&
                    (text =~ /(?:\bCRC32\b|NbtIo\.(?:readCompressed|writeCompressed)|\bMessageDigest\b)/).find()) {
                violations.add("History or recovery bypasses the shared current-format envelope: ${path}")
            }
            boolean shared = packageName.startsWith('io.github.fastformer.workspace') ||
                    packageName.startsWith('io.github.fastformer.network.codec') ||
                    packageName.startsWith('io.github.fastformer.fastplace.geometry')
            if (main && shared && (text =~ /(?:io\.github\.fastformer|net\.minecraft)\.client\./).find()) {
                violations.add("Shared source depends on client runtime: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.protocol.') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|server|network)\.|net\.minecraft\.(?:client|server)\.|\bFastPlaceSettings\b)/).find()) {
                violations.add("Protocol depends on runtime state or a network handler: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.protocol.c2s.') &&
                    (dependencies =~ /io\.github\.fastformer\.protocol\.s2c\./).find() ||
                    main && packageName.startsWith('io.github.fastformer.protocol.s2c.') &&
                    (dependencies =~ /io\.github\.fastformer\.protocol\.c2s\./).find()) {
                violations.add("Directional protocol depends on the opposite direction: ${path}")
            }
            if (main && (packageName.startsWith('io.github.fastformer.common.history') ||
                    packageName.startsWith('io.github.fastformer.common.raycast') ||
                    packageName.startsWith('io.github.fastformer.common.preview')) &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|server|network|protocol)\.|net\.minecraft\.(?:client|server)\.|\bFastPlaceSettings\b)/).find()) {
                violations.add("Shared data model depends on a runtime or wire implementation: ${path}")
            }
            if (main && (text =~ /io\.github\.fastformer\.network\.(?:payload|sync)\./).find()) {
                violations.add("Retired protocol or sync package reference: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.workspace') &&
                    (text =~ /io\.github\.fastformer\.network\./).find()) {
                violations.add("Workspace model depends on network transport: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.core.') &&
                    (text =~ /(?:net\.minecraft\.|net\.neoforged\.|io\.github\.fastformer\.(?!core\.))/).find()) {
                violations.add("Core infrastructure depends on game or feature code: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.common.tinker') &&
                    (text =~ /(?:io\.github\.fastformer\.(?:client|server|network|fastplace)\.|net\.minecraft\.(?:client|server)\.)/).find()) {
                violations.add("Shared tinker rules depend on runtime admission or world writes: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.recovery') &&
                    (text =~ /io\.github\.fastformer\.(?:fastplace|server)\.history\./).find()) {
                violations.add("Recovery depends on history implementation instead of its reconciliation SPI: ${path}")
            }
            if (main && source.name == 'PersistentRecoveryJournal.java' &&
                    (text =~ /(?:\bstatic\s+(?:volatile\s+boolean|final\s+(?:Map|java\.util\.Set))\s+|\b(?:writesAllowed|blockNewWrites|resetWriteGateForTest|recoverAll|onLevelSaved)\s*\()/).find()) {
                violations.add("Journal file owns server recovery admission or shared cleanup state: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.recovery.gate') &&
                    (dependencies =~ /(?:net\.|io\.github\.fastformer\.(?!core\.))/).find()) {
                violations.add("Recovery gate depends on storage, game runtime, or orchestration: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.history.commit') &&
                    (text =~ /(?:net\.minecraft\.|net\.neoforged\.|io\.github\.fastformer\.(?!server\.history\.commit[.;]))/).find()) {
                violations.add("Commit state machine depends on storage or world runtime: ${path}")
            }
            if (main && source.name == 'HistoryService.java' && (text =~ /\b\w+ForTest\b/).find()) {
                violations.add("History service exposes a test-only hook: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.intent') &&
                    (dependencies =~ /io\.github\.fastformer\.(?:network\.|server\.input\.ServerInputDispatcher)/).find()) {
                violations.add("Player intent handling depends on a transport or input facade: ${path}")
            }
            if (main && source.name == 'FastPlaceNetwork.java' && (text =~ /instanceof ServerPlayer/).find()) {
                violations.add("Network registration bypasses typed server channels: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.sync') &&
                    (dependencies =~ /(?:\bstatic\s+final\s+Map\s*<|\bConcurrentHashMap\b|\bclearServer\s*\()/).find()) {
                violations.add("Preview publications bypass the player scope lifecycle: ${path}")
            }
            if (main && (text =~ /\b(?:FastPlaceManager|OperationManager|GeometryManager)\b/).find()) {
                violations.add("Retired static workflow facade: ${path}")
            }
            if (main && (text =~ /\bWorldTaskFeature\b/).find()) {
                violations.add("Retired scheduler and feedback facade: ${path}")
            }
            if (main && (text =~ /\b(?:WorldWriteTask|WorldOperationTask|OperationTaskResult)\b/).find()) {
                violations.add("Retired split world task contract: ${path}")
            }
            if (main && source.name in ['QuickShapeSystem.java', 'OperationSystem.java'] &&
                    (text =~ /(?:\bWorldTaskBudget\b|task\.(?:prepareJournal|validateSnapshots|finalizeSnapshots|recordBatch|place)\s*\()/).find()) {
                violations.add("Workflow owns task batch scheduling instead of advancing its queue: ${path}")
            }
            if (main && source.name == 'QuickShapeSystem.java' &&
                    (dependencies =~ /(?:runtime\.(?:operation|geometry)\b|\b(?:classify|setModifierHeld|modifierHeld|operationActive|detachPlayer|handleDimensionChange|syncCurrentPreview|restoreActive|restoreTossedItem)\s*\(ServerPlayer\s)/).find()) {
                violations.add("Quick shape owns cross-session interaction or player lifecycle: ${path}")
            }
            if (main && packageName == 'io.github.fastformer.server.task.block' &&
                    source.name in ['PlacementTask.java', 'SelectionOperationTask.java', 'SubmittedWorkspaceTask.java']) {
                if (!(text =~ /extends\s+LeasedJournaledTask\b/).find() ||
                        (text =~ /\bprivate\s+(?:final\s+)?(?:TaskWriteLease|WorldJournalPreparation|JournalSegments)\s+/).find()) {
                    violations.add("Block writer bypasses shared task resource ownership: ${path}")
                }
            }
            if (main && packageName in ['io.github.fastformer.server.task.runtime', 'io.github.fastformer.server.task.block'] &&
                    (dependencies =~ /io\.github\.fastformer\.(?:client\.|network\.|server\.session\.)/).find()) {
                violations.add("Task algorithm or resource lifecycle depends on feature orchestration: ${path}")
            }
            if (main && (packageName.startsWith('io.github.fastformer.fastplace.task') ||
                    (dependencies =~ /io\.github\.fastformer\.fastplace\.(?:task\.|world\.WorldTask(?:Budget|Context)\b)/).find())) {
                violations.add("Retired world-task package reference: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.task') &&
                    (dependencies =~ /(?:\btesting(?:Adaptive|SmallOperation)?\s*\(|\b\w+ForTest\b)/).find()) {
                violations.add("World-task production code exposes a test-only hook: ${path}")
            }
            if (main && (text =~ /\bWorldWriteCoordinator\b/).find()) {
                violations.add("Retired global world-write coordinator: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.worldwrite') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|network|fastplace|server\.(?!worldwrite))\.|\bMinecraftServer\b|\bstatic\s+final\s+Map\s*<|\b\w+ForTest\b)/).find()) {
                violations.add("World-write leases bypass their instance or depend on journal/orchestration state: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.feedback') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|network|server\.(?!feedback))\.|\bstatic\s+final\s+Map\s*<|\b\w+ForTest\b)/).find()) {
                violations.add("Task feedback bypasses its server owner or depends on task orchestration: ${path}")
            }
            if (main && packageName == 'io.github.fastformer.server.submission' &&
                    source.name in ['WorkspaceSubmissionLedger.java', 'WorkspaceSubmissionBook.java'] &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|network|server\.(?!submission))\.|net\.minecraft\.server\.|\bstatic\s+final\s+Map\s*<|\bclearAll\s*\()/).find()) {
                violations.add("Submission state bypasses its instance owner or depends on runtime orchestration: ${path}")
            }
            if (main && packageName == 'io.github.fastformer.server.session' &&
                    source.name != 'SessionSystem.java' &&
                    (text =~ /(?:\bstatic\s+final\s+(?:PlayerSessions|WorldTaskQueue|Map)\s*<|\b\w+ForTest\b)/).find()) {
                violations.add("Workflow bypasses its server instance or exposes a test-only hook: ${path}")
            }
            if (main && source.name == 'FastPlaceNetwork.java' &&
                    (text =~ /\b(?:IncomingPayloadTransfers|WorkspaceDecodeQueue|WorkspaceReceipts|WorkspaceUploads|serverEpoch|WORKSPACE_CALLBACK_SCOPES)\b/).find()) {
                violations.add("Network registration owns upload state or bypasses its system boundary: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.network.upload') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client\.|network\.FastPlaceNetwork)|\b\w+ForTest\b)/).find()) {
                violations.add("Upload lifecycle depends on client/registration or exposes a test-only hook: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.protocol.upload') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|server)\.|net\.minecraft\.(?:client|server)\.)/).find()) {
                violations.add("Upload protocol depends on a runtime owner: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.history.entry') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|network|server\.(?!history\.entry\.))|net\.neoforged\.)/).find()) {
                violations.add("History entry depends on orchestration, transport, or live configuration: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.history.compaction') &&
                    (dependencies =~ /(?:io\.github\.fastformer\.(?:client|network|server\.(?!history\.(?:entry|compaction)\.))|net\.minecraft\.(?:client|server)\.|net\.neoforged\.)/).find()) {
                violations.add("Pure history compaction depends on mutable runtime state: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.history.memory') &&
                    (dependencies =~ /(?:net\.|io\.github\.fastformer\.(?!core\.async\.|server\.history\.(?:entry|memory|compaction)\.))/).find()) {
                violations.add("History memory depends on world runtime or storage orchestration: ${path}")
            }
            if (main && (packageName.startsWith('io.github.fastformer.server.history.memory') ||
                    source.name in ['HistoryRepository.java', 'DiskHistoryRepository.java', 'HistoryLoading.java', 'OwnerHistory.java']) &&
                    (dependencies =~ /\bWorldChangeBatch\b/).find()) {
                violations.add("Generic history storage or ownership depends on block entries: ${path}")
            }
            if (main && source.name == 'HistoryReplayTask.java' &&
                    (dependencies =~ /\b(?:WorldChangeBatch|ReversibleBlockSnapshot|HistoryConflictResolution|WorldJournalPreparation)\b/).find()) {
                violations.add("Generic history replay bypasses its entry state or journal boundary: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.server.history.store') &&
                    (dependencies =~ /(?:net\.|io\.github\.fastformer\.(?!core\.))/).find()) {
                violations.add("History disk store depends on decoded entries or game runtime: ${path}")
            }
            if (main && source.name == 'HistoryWriteQueue.java' &&
                    (text =~ /(?m)^import (?:net\.|io\.github\.fastformer\.(?!core\.async\.))/).find()) {
                violations.add("History write ordering depends on game or feature runtime: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.network.transport') &&
                    (text =~ /(?:io\.github\.fastformer|net\.minecraft)\.(?:client|server)\./).find()) {
                violations.add("Portable transport depends on a physical-side implementation: ${path}")
            }
            if (main && packageName == 'io.github.fastformer.client.network.inbound' &&
                    source.name != 'ClientInboundSystem.java' &&
                    (text =~ /io\.github\.fastformer\.client\.(?:input|operation|render|ui)\./).find()) {
                violations.add("Inbound queue depends on client business handlers: ${path}")
            }
            if (main && packageName.startsWith('io.github.fastformer.client.session.reconnect') &&
                    (text =~ /(?:net\.minecraft\.|net\.neoforged\.|io\.github\.fastformer\.(?!client\.session\.reconnect[.;])[a-z])/).find()) {
                violations.add("Reconnect wait depends on business state: ${path}")
            }
            if (gameTest && !(source.name.contains('GameTests') || source.name.endsWith('TestAccess.java') || source.name == 'RecoveryProcessTests.java')) {
                violations.add("Unexpected production type in test source: ${path}")
            }
        }
        boundedPackages.each { name, sources ->
            if (sources.size() > 12) violations.add("Responsibility package exceeds 12 types: ${name} (${sources.size()})")
            if (!new File(sources.first().parentFile, 'package-info.java').isFile()) {
                violations.add("Responsibility package lacks a description: ${name}")
            }
        }
        if (!violations.isEmpty()) throw new GradleException(violations.join('\n'))
    }
}

tasks.register('verifySourceLayout', VerifySourceLayout) {
    javaSources.from(sourceSets.main.allJava, sourceSets.test.allJava, sourceSets.gameTest.allJava)
}
tasks.named('check') { dependsOn tasks.named('verifySourceLayout') }
