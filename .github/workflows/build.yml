name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-reports
          path: |
            run/**/logs/**
            build/reports/**

  recovery:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [FirstWrite, BeforeHistoryBatch, AfterHistoryBatch, SealedHistory, PublishedHistory, MultipleHistory, MixedHistory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat classes --no-daemon
      - shell: pwsh
        run: ./scripts/Test-RecoveryRestart.ps1 -RunDirectory run/ci-recovery-${{ matrix.scenario }} -Scenario ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.scenario }}
          path: |
            run/ci-recovery-*/logs/**
            run/ci-recovery-*/recovery-process-*.txt
            build/reports/**
